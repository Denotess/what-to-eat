{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover delicious meal recipes from around the world">
    <title>{% block title %}What To Eat{% endblock %}</title>
    
    <link rel="stylesheet" href="{% static 'css/whattoeat.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.js" integrity="sha384-ezjq8118wdwdRMj+nX4bevEi+cDLTbhLAeFF688VK8tPDGeLUe0WoY2MZtSla72F" crossorigin="anonymous"></script>
</head>
<body>
    <nav class="nav" role="navigation" aria-label="Main navigation">
        <div class="nav__container container">
            <a href="{% url 'index' %}" class="nav__brand">
                🍽️ What To Eat
            </a>
            
            <form action="{% url 'search_results' %}" method="GET" class="nav__search-form" role="search">
                <div style="position: relative;">
                    <input
                        type="search"
                        name="search"
                        id="global-search"
                        class="input"
                        placeholder="Search for meals..."
                        autocomplete="off"
                        aria-label="Search for meals"
                        hx-get="{% url 'autocomplete' %}"
                        hx-trigger="input changed delay:300ms"
                        hx-target="#autocomplete-results"
                        hx-swap="innerHTML"
                    >
                    <div id="autocomplete-results" class="autocomplete" role="listbox" aria-label="Search suggestions"></div>
                </div>
            </form>
            
            <ul class="nav__links" role="menubar">
                <li role="none">
                    <a href="{% url 'index' %}" class="nav__link focus-ring" role="menuitem">Home</a>
                </li>
                <li role="none">
                    <a href="{% url 'favorites' %}" class="nav__link focus-ring" role="menuitem">Favorites</a>
                </li>
                <li role="none">
                    <a href="#" class="nav__link focus-ring" role="menuitem" aria-label="Help">Help</a>
                </li>
        </div>
    </nav>

    <main id="main-content" role="main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script>
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const autocomplete = document.getElementById('autocomplete-results');
                if (autocomplete) {
                    autocomplete.innerHTML = '';
                }
            }
        });
        
        document.addEventListener('click', function(e) {
            const searchInput = document.getElementById('global-search');
            const autocomplete = document.getElementById('autocomplete-results');
            if (autocomplete && searchInput && !searchInput.contains(e.target) && !autocomplete.contains(e.target)) {
                autocomplete.innerHTML = '';
            }
        });
    </script>
</body>
</html>
