{% extends 'base.html' %}

{% block title %}Home - What To Eat{% endblock %}

{% block content %}
    <section class="section">
        <div class="section__header">
            <h1 class="section__title">Discover Delicious Meals</h1>
            <p class="section__subtitle">Browse by category to find your next favorite dish</p>
        </div>
        
        <div style="max-width: 400px; margin: 0 auto 3rem;">
            <form id="meal-form">
                <label for="categories" class="sr-only">Select meal category</label>
                <select
                    name="categories"
                    id="categories"
                    class="select focus-ring"
                    hx-get="{% url 'load_meals' %}"
                    hx-trigger="load, change"
                    hx-target="#results"
                    hx-swap="innerHTML"
                    hx-include="[name='categories']"
                    aria-label="Select a meal category"
                >
                    <option value="">Choose a category...</option>
                    {% for c in categories %}
                         <option value="{{ c }}" {% if c == random_category %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </form>
        </div>
        
        <div id="results" class="grid grid--3" role="region" aria-live="polite" aria-label="Meal results"></div>
    </section>
{% endblock %}
